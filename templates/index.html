{% extends "base.html" %}
{% block title %}{{ t("index_title") }} | Deadline Catcher{% endblock %}
{% block content %}
{% if error %}
<div class="callout callout-error" role="alert">{{ error }}</div>
{% endif %}

<div class="split">
  <section class="intro">
    <h1>{{ t("index_title") }}</h1>
    <p class="lede">{{ t("index_intro") }}</p>
  </section>

  <form class="sheet" action="/analyze" method="post">
    <input type="hidden" name="lang" value="{{ lang }}">
    <div class="field">
      <label for="letter">{{ t("letter_label") }}</label>
      <textarea id="letter" name="letter" rows="10" required></textarea>
    </div>

    <div class="field-row">
      <div>
        <label for="notice_date">{{ t("notice_label") }}</label>
        <input type="date" id="notice_date" name="notice_date">
      </div>
      <div>
        <label for="received_date">{{ t("received_label") }}</label>
        <input type="date" id="received_date" name="received_date">
      </div>
    </div>

    <p class="fineprint">{{ t("privacy") }}</p>
    <button type="submit" class="btn btn-primary">{{ t("find_button") }}</button>
  </form>
</div>
{% endblock %}
