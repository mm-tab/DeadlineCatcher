{% extends "base.html" %}
{% block content %}
<h1 class="h3">{{ t("index_title") }}</h1>
<p class="text-muted">{{ t("index_intro") }}</p>

{% if error %}
<div class="alert alert-warning" role="alert">{{ error }}</div>
{% endif %}

<form action="/analyze" method="post">
  <input type="hidden" name="lang" value="{{ lang }}">
  <div class="mb-3">
    <label for="letter" class="form-label">{{ t("letter_label") }}</label>
    <textarea class="form-control" id="letter" name="letter" rows="10" required></textarea>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-sm-6">
      <label for="notice_date" class="form-label">{{ t("notice_label") }}</label>
      <input type="date" class="form-control" id="notice_date" name="notice_date">
    </div>
    <div class="col-sm-6">
      <label for="received_date" class="form-label">{{ t("received_label") }}</label>
      <input type="date" class="form-control" id="received_date" name="received_date">
    </div>
  </div>

  <p class="small text-muted">{{ t("privacy") }}</p>
  <button type="submit" class="btn btn-primary">{{ t("find_button") }}</button>
</form>
{% endblock %}
