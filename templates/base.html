<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deadline Catcher</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <a class="visually-hidden-focusable" href="#main">{{ t("skip") }}</a>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/?lang={{ lang }}">Deadline Catcher</a>
      <a class="btn btn-outline-light btn-sm" href="/?lang={{ t('switch_lang') }}" lang="{{ t('switch_lang') }}">{{ t("switch_label") }}</a>
    </div>
  </nav>
  <main id="main" class="container pb-5">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
