<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Deadline Catcher{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">{{ t("skip") }}</a>
  <header class="band">
    <div class="wrap band-inner">
      <div class="window"><a class="brand" href="/?lang={{ lang }}">Deadline Catcher</a></div>
      <div class="window"><a class="lang-switch" href="/?lang={{ t('switch_lang') }}" lang="{{ t('switch_lang') }}">{{ t("switch_label") }}</a></div>
    </div>
  </header>
  <main id="main" class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
